<script id="theme-init">(function () {
  'use strict';
  const key = 'ui-glossary-theme';
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  let preference = null;
  const valid = value => value === 'dark' || value === 'light';
  try {
    const stored = localStorage.getItem(key);
    if (valid(stored)) preference = stored;
  } catch (_) { /* Local files and private sessions may disable storage. */ }

  function apply(theme) {
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
    const button = document.getElementById('theme-toggle');
    if (button) {
      const label = theme === 'dark' ? '日间模式' : '夜间模式';
      button.textContent = label;
      button.setAttribute('aria-label', '切换到' + label);
      button.setAttribute('title', '切换到' + label);
    }
  }
  function currentTheme() { return preference || (system.matches ? 'dark' : 'light'); }
  apply(currentTheme()); // Runs before the stylesheet and first paint.
  system.addEventListener('change', event => {
    if (!preference) apply(event.matches ? 'dark' : 'light');
  });
  window.addEventListener('storage', event => {
    if (event.key !== key && event.key !== null) return;
    preference = valid(event.newValue) ? event.newValue : null;
    apply(currentTheme());
  });
  document.addEventListener('DOMContentLoaded', () => {
    apply(currentTheme());
    document.getElementById('theme-toggle').addEventListener('click', () => {
      preference = currentTheme() === 'dark' ? 'light' : 'dark';
      apply(preference);
      try { localStorage.setItem(key, preference); } catch (_) { /* Toggling remains usable. */ }
    });
  });
})();
</script>

      el.innerHTML = '<div class="ui-window ui-drawer-host"><div class="ui-window-top"><b>项目列表</b><span>非模态抽屉示例</span></div><div class="ui-window-body"><span class="d-label">原型项目 A</span><p class="d-muted">待评审 · 12 个页面</p><button class="d-btn primary" type="button" data-open style="margin-top:16px">查看详情 →</button><div style="margin-top:28px"><button class="d-btn small" type="button" data-count>背景计数 0</button><p class="d-muted" style="margin-top:9px">抽屉打开时<br>也能点这个按钮。</p></div></div><section class="ui-drawer-panel" role="dialog" aria-modal="false" aria-labelledby="' + titleId + '" hidden><div class="ui-label-row"><span class="d-muted">从右侧展开</span><button class="quiet-btn" type="button" data-close aria-label="关闭详情抽屉">关闭 ×</button></div><h3 id="' + titleId + '">原型项目 A</h3><p>当前页面不跳转，在侧边查看完整详情。</p><div class="ui-score">86<small>分</small></div><p>演示模式：允许继续操作背景。</p></section></div>';
      const open = el.querySelector('[data-open]'), panel = el.querySelector('.ui-drawer-panel'), close = el.querySelector('[data-close]');
      function hide() { panel.hidden = true; open.focus(); api.status('抽屉已关闭，原页面还在原来的位置。'); }
      api.on(open,'click',function () { panel.hidden = false; close.focus(); api.status('抽屉从侧边展开。这个示例是非模态的，左侧背景计数仍可点。'); api.done(); });
      api.on(close,'click',hide);
      api.on(document,'keydown',function (e) { if (e.key === 'Escape' && !panel.hidden) hide(); });
      api.on(el.querySelector('[data-count]'),'click',function (e) { clicks++; e.currentTarget.textContent = '背景计数 ' + clicks; api.status('背景仍可操作。注意：抽屉也可以被设计为模态，位置与交互模式是两回事。'); api.done(); });
      api.status('点击「查看详情」。这个演示把详情放在右侧，允许继续操作左侧背景。');
    },
    modal: function (el, api) {
      const titleId = uid('modal-title'), descId = uid('modal-desc');
      let count = 0;
      el.innerHTML = windowCard('项目列表', '<div class="ui-window-body ui-modal-preview"><h3 data-record>演示记录 A</h3><p>点击移除时，先让你明确作出选择。</p><div class="d-flex"><button type="button" class="d-btn primary" data-open>模拟移除记录</button><button class="d-btn" type="button" data-restore hidden>恢复演示记录</button></div><button class="d-btn small" type="button" data-count style="margin-top:30px">背景计数 0</button><p class="d-muted" style="margin-top:12px;margin-bottom:0">弹窗出现后，试试点击背景按钮。</p></div>') + '<dialog class="ui-modal-dialog" aria-labelledby="' + titleId + '" aria-describedby="' + descId + '"><div class="ui-modal-symbol" aria-hidden="true">?</div><h3 id="' + titleId + '">确认模拟移除？</h3><p id="' + descId + '">这只会改变本页的演示状态。Modal 打开时，背景不能继续操作；先取消或确认，才能回到页面。</p><div class="d-flex"><button class="d-btn" type="button" data-cancel autofocus>取消</button><button class="d-btn primary" type="button" data-confirm>确认模拟移除</button></div></dialog>';
      const dialog = el.querySelector('dialog'), open = el.querySelector('[data-open]'), restore = el.querySelector('[data-restore]');
      api.on(dialog,'keydown',function (e) {
        if (e.key !== 'Tab') return;
        const buttons = Array.from(dialog.querySelectorAll('button:not(:disabled)'));
        const first = buttons[0], last = buttons[buttons.length-1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      });
      api.on(open,'click',function () { dialog.showModal(); api.status('Modal 已打开：背景暂时不可操作，键盘焦点留在弹窗中。'); api.done(); });
      api.on(el.querySelector('[data-cancel]'),'click',function () { dialog.close('cancel'); });
      api.on(el.querySelector('[data-confirm]'),'click',function () { dialog.close('confirm'); });
      api.on(dialog,'close',function () { if (dialog.returnValue === 'confirm') { el.querySelector('[data-record]').textContent = '记录已模拟移除'; open.disabled = true; restore.hidden = false; restore.focus(); api.status('确认后才执行模拟操作。点「恢复演示记录」可再体验一次。'); } else { api.status('已取消，回到原页面。Modal 的关键是背景交互被阻断，不只是位置居中。'); } dialog.returnValue = ''; });
      api.on(restore,'click',function () { el.querySelector('[data-record]').textContent = '演示记录 A'; open.disabled = false; restore.hidden = true; open.focus(); api.status('演示记录已恢复。'); });
      api.on(el.querySelector('[data-count]'),'click',function (e) { count++; e.currentTarget.textContent = '背景计数 ' + count; api.done(); });
      api.status('点击「模拟移除记录」。弹窗出现时，背景按钮会暂时无法操作。');
      return function () { if (dialog.open) dialog.close(); };
    }
  });
})();
</script>
<script>(function () {
  'use strict';
  window.DEMO_RENDERERS = window.DEMO_RENDERERS || {};

  function spark(values, className) {
    const w = 500, h = 110, p = 10;
    const min = Math.min.apply(null, values) - 4;
    const max = Math.max.apply(null, values) + 4;
    const pts = values.map((v, i) => [p + i * (w - p * 2) / (values.length - 1), h - p - (v - min) / (max - min) * (h - p * 2)]);
    const line = pts.map(pt => pt.join(',')).join(' ');
    return '<svg class="bh-spark ' + (className || '') + '" viewBox="0 0 500 110" role="img" aria-label="模拟数据变化的折线图"><path class="bh-chart-grid" d="M10 27H490 M10 55H490 M10 83H490"/><polyline class="bh-chart-line" points="' + line + '"/><circle class="bh-chart-dot" cx="' + pts[pts.length - 1][0] + '" cy="' + pts[pts.length - 1][1] + '" r="4"/></svg>';
  }

  function metric(label, value, cls) {
    return '<div class="bh-metric"><span class="bh-caption">' + label + '</span><strong class="bh-value ' + (cls || '') + '">' + value + '</strong></div>';
  }

  Object.assign(window.DEMO_RENDERERS, {
    refresh: function (el, api) {
      let batch = 1, busy = false;
      el.innerHTML = '<div class="bh-demo"><div class="bh-toolbar"><div><span class="bh-eyebrow">模拟项目数据</span><h3>点一下，更新一次。</h3></div><button type="button" class="d-btn primary bh-refresh-btn"><span aria-hidden="true" class="bh-refresh-icon">↻</span> 手动刷新</button></div><div class="bh-refresh-content" aria-live="polite"></div><div class="bh-footnote">只有你按下按钮，才会开始新一次更新。</div></div>';
      const button = el.querySelector('.bh-refresh-btn');
      const content = el.querySelector('.bh-refresh-content');
      function render() {
        const base = [64, 48, 82];
        content.innerHTML = '<div class="bh-snapshot"><span class="bh-tag">已完成</span><span>第 ' + batch + ' 次数据快照</span></div><div class="bh-data-list">' + ['视觉素材整理', '界面原型制作', '需求文档检查'].map((name, i) => '<div class="bh-data-row"><span>' + name + '</span><div class="bh-progress"><span style="width:' + (base[i] + (batch * (i + 2)) % 15) + '%"></span></div><strong>' + (base[i] + (batch * (i + 2)) % 15) + '%</strong></div>').join('') + '</div>';
      }
      render();
      api.status('当前是第 1 次快照。点击刷新后，会出现等待状态与新的快照。');
      api.on(button, 'click', function () {
        if (busy) return;
        busy = true;
        button.disabled = true;
        button.classList.add('is-loading');
        content.innerHTML = '<div class="bh-snapshot"><span class="bh-tag">正在加载</span><span>模拟请求处理中…</span></div><div class="bh-skeleton" aria-label="数据正在加载"><i></i><i></i><i></i></div>';
        api.status('正在等待新数据：原位置先显示骨架屏。');
        api.later(function () {
          batch += 1;
          busy = false;
          button.disabled = false;
          button.classList.remove('is-loading');
          render();
          api.status('刷新完成：第 ' + batch + ' 次快照已显示。没有再次点击，就不会继续请求。');
          api.done();
        }, 800);
      });
    },

    polling: function (el, api) {
      let running = false, nextAt = 0, requests = 0, replies = 0, token = 0;
      el.innerHTML = '<div class="bh-demo"><div class="bh-toolbar"><div><span class="bh-eyebrow">轮询 · 演示间隔 3 秒</span><h3>隔一会儿，主动问一次。</h3></div><button type="button" class="d-btn primary bh-poll-toggle">开始轮询</button></div><div class="bh-network"><div class="bh-endpoint"><span class="bh-device" aria-hidden="true">▤</span><strong>页面</strong><small>主动发问</small></div><div class="bh-wire"><span class="bh-wire-label">有新数据吗？ →</span><div class="bh-wire-line"><i></i></div><span class="bh-wire-reply">← 返回当前数据</span></div><div class="bh-endpoint"><span class="bh-device" aria-hidden="true">▥</span><strong>模拟服务</strong><small>收到才回答</small></div></div><div class="bh-metrics">' + metric('发起请求', '0', 'bh-request-num') + metric('收到返回', '0', 'bh-reply-num') + '</div><div class="bh-countdown"><span class="bh-poll-label">尚未启动</span><div class="bh-progress"><span style="width:0%"></span></div></div></div>';
      const toggle = el.querySelector('.bh-poll-toggle');
      const progress = el.querySelector('.bh-countdown .bh-progress span');
      const label = el.querySelector('.bh-poll-label');
      const network = el.querySelector('.bh-network');
      const requestCount = el.querySelector('.bh-request-num');
      const replyCount = el.querySelector('.bh-reply-num');
      function request() {
        requests++;
        requestCount.textContent = requests;
        network.classList.add('is-sending');
        api.status('第 ' + requests + ' 次轮询：页面主动向模拟服务请求数据。');
        const localToken = token;
        api.later(function () {
          if (localToken !== token) return;
          replies++;
          replyCount.textContent = replies;
          network.classList.remove('is-sending');
          api.done();
        }, 450);
      }
      api.on(toggle, 'click', function () {
        running = !running;
        toggle.textContent = running ? '停止轮询' : '开始轮询';
        toggle.classList.toggle('primary', !running);
        if (running) {
          nextAt = Date.now() + 3000;
          api.status('已开始：倒计时结束就问一次，即使没有新数据也会发问。');
        } else {
          label.textContent = '已停止 · 不再发起新请求';
          progress.style.width = '0%';
          api.status('已停止轮询。已发出的请求仍可返回，新请求不会再发起。');
        }
        api.done();
      });
      api.every(function () {
        if (!running) return;
        const remaining = nextAt - Date.now();
        if (remaining <= 0) {
          request();
          nextAt = Date.now() + 3000;
        }
        const seconds = Math.max(0, nextAt - Date.now()) / 1000;
        label.textContent = seconds.toFixed(1) + ' 秒后再次询问';
        progress.style.width = ((3 - seconds) / 3 * 100) + '%';
      }, 100);
      api.status('按「开始轮询」后，观察页面每 3 秒主动发起一次请求。这里没有真实网络请求。');
      return function () { token++; };
    },

    debounce: function (el, api) {
      let inputs = 0, requests = 0, generation = 0, playback = 0, deadline = 0, pending = false, composing = false;
      el.innerHTML = '<div class="bh-demo"><div class="bh-toolbar"><div><span class="bh-eyebrow">防抖 · 停下来 300ms 后执行</span><h3>先等你把话说完。</h3></div><button type="button" class="d-btn bh-type-play">播放一段输入</button></div><label class="bh-field-label">输入关键词<input class="d-input bh-debounce-input" placeholder="试着连续输入：床垫设计" autocomplete="off"></label><div class="bh-event-line"><span>输入事件</span><div class="bh-event-dots" aria-hidden="true"></div></div><div class="bh-metrics">' + metric('输入事件次数', '0', 'bh-input-num') + metric('实际模拟请求', '0', 'bh-search-num') + '</div><div class="bh-debounce-wait"><span class="bh-wait-label">等待输入</span><div class="bh-progress"><span style="width:0%"></span></div></div><div class="bh-result" role="status">请求结果会显示在这里</div></div>';
      const input = el.querySelector('.bh-debounce-input');
      const play = el.querySelector('.bh-type-play');
      const dotRow = el.querySelector('.bh-event-dots');
      const progress = el.querySelector('.bh-debounce-wait .bh-progress span');
      const wait = el.querySelector('.bh-wait-label');
      const result = el.querySelector('.bh-result');
      function scheduleQuery() {
        const key = ++generation;
        pending = true;
        deadline = Date.now() + 300;
        wait.textContent = '重新等 300ms…';
        api.status('又输入了一个字符：之前的等待被取消，重新计时 300ms。');
        api.later(function () {
          if (key !== generation || composing) return;
          pending = false;
          progress.style.width = '100%';
          const value = input.value.trim();
          if (!value) {
            wait.textContent = '输入为空 · 本例不发送请求';
            result.textContent = '请先输入关键词';
            return;
          }
          requests++;
          el.querySelector('.bh-search-num').textContent = requests;
          wait.textContent = '停顿已满 300ms · 执行一次';
          result.textContent = '第 ' + requests + ' 次模拟查询：「' + value + '」';
          api.status('输入事件累计 ' + inputs + ' 次，实际模拟查询 ' + requests + ' 次。连续输入会合并为停顿后的查询。');
          api.done();
        }, 300);
      }
      function onInput(isComposing) {
        inputs++;
        el.querySelector('.bh-input-num').textContent = inputs;
        dotRow.innerHTML = '<i></i>'.repeat(Math.min(inputs, 24));
        if (composing || isComposing) {
          generation++;
          pending = false;
          progress.style.width = '0%';
          wait.textContent = '输入法组合中 · 暂不查询';
          api.status('拼音还没有确认成文字，先不查询；确认汉字后再开始等待 300ms。');
          return;
        }
        scheduleQuery();
      }
      api.on(input, 'compositionstart', function () {
        composing = true;
        playback++;
        generation++;
        pending = false;
        play.disabled = true;
        progress.style.width = '0%';
        wait.textContent = '输入法组合中 · 暂不查询';
      });
      api.on(input, 'compositionend', function () {
        composing = false;
        play.disabled = false;
        // A following native input event may reset this timer, but cannot create
        // a duplicate query. compositionend itself is not counted as input.
        scheduleQuery();
      });
      api.on(input, 'input', function (event) {
        playback++;
        play.disabled = composing || !!event.isComposing;
        onInput(!!event.isComposing);
      });
      api.on(play, 'click', function () {
        const key = ++playback;
        generation++;
        pending = false;
        composing = false;
        inputs = 0;
        requests = 0;
        input.value = '';
        dotRow.innerHTML = '';
        progress.style.width = '0%';
        el.querySelector('.bh-input-num').textContent = '0';
        el.querySelector('.bh-search-num').textContent = '0';
        result.textContent = '正在连续输入，每个字符相隔 100ms…';
        play.disabled = true;
        const text = '床垫设计方案';
        Array.from(text).forEach(function (character, index) {
          api.later(function () {
            if (key !== playback) return;
            input.value += character;
            onInput();
            if (index === text.length - 1) play.disabled = false;
          }, index * 100 + 100);
        });
      });
      api.every(function () {
        if (!pending) return;
        const rest = Math.max(0, deadline - Date.now());
        progress.style.width = (100 - rest / 3) + '%';
      }, 30);
      api.status('连续输入，或播放一段输入。注意左侧输入次数会一直增加，右侧只在停顿后增加。');
    },

    throttle: function (el, api) {
      let raw = 0, handled = 0, lastAt = -Infinity, playToken = 0;
      el.innerHTML = '<div class="bh-demo"><div class="bh-toolbar"><div><span class="bh-eyebrow">节流 · 至少相隔 300ms</span><h3>再忙，也按节奏处理。</h3></div><button type="button" class="d-btn bh-drag-play">播放连续拖动</button></div><label class="bh-field-label">拖动位置 <span class="bh-position">0</span><input type="range" min="0" max="100" value="0" step="1" class="bh-throttle-input" aria-label="拖动位置"></label><div class="bh-positions"><div><span>每次输入</span><div class="bh-position-track"><i class="bh-raw-dot" style="left:0%"></i></div><b class="bh-raw-pos">0</b></div><div><span>节流处理</span><div class="bh-position-track accent"><i class="bh-handled-dot" style="left:0%"></i></div><b class="bh-handled-pos">0</b></div></div><div class="bh-metrics">' + metric('原始事件次数', '0', 'bh-raw-num') + metric('实际处理次数', '0', 'bh-handled-num') + '</div><div class="bh-footnote">本演示立即处理第一个事件；300ms 内其余事件跳过。停止后不追加最后一次。</div></div>';
      const input = el.querySelector('.bh-throttle-input');
      const play = el.querySelector('.bh-drag-play');
      function update(value) {
        raw++;
        input.value = value;
        el.querySelector('.bh-position').textContent = value;
        el.querySelector('.bh-raw-pos').textContent = value;
        el.querySelector('.bh-raw-dot').style.left = value + '%';
        el.querySelector('.bh-raw-num').textContent = raw;
        const now = Date.now();
        if (now - lastAt >= 300) {
          handled++;
          lastAt = now;
          el.querySelector('.bh-handled-pos').textContent = value;
          el.querySelector('.bh-handled-dot').style.left = value + '%';
          el.querySelector('.bh-handled-num').textContent = handled;
          api.done();
        }
        api.status('产生 ' + raw + ' 次事件，处理 ' + handled + ' 次。橙色位置只在允许的时间点跟进。');
      }
      api.on(input, 'input', function () {
        playToken++;
        play.disabled = false;
        update(Number(input.value));
      });
      api.on(play, 'click', function () {
        const token = ++playToken;
        raw = 0;
        handled = 0;
        lastAt = -Infinity;
        play.disabled = true;
        for (let i = 0; i <= 40; i++) {
          api.later(function () {
            if (token !== playToken) return;
            update(Math.round(i * 2.5));
            if (i === 40) play.disabled = false;
          }, i * 40);
        }
      });
      api.status('拖动滑块，或播放连续拖动。节流允许在持续操作期间定期处理，不必等你停下。');
    },

    'auto-refresh': function (el, api) {
      let running = true, batch = 1, nextAt = Date.now() + 3000;
      let points = [40, 43, 41, 47, 46, 51, 53, 50, 55];
      el.innerHTML = '<div class="bh-demo"><div class="bh-toolbar"><div><span class="bh-eyebrow">自动刷新 · 模拟数据</span><h3>页面自己保持更新。</h3></div><button type="button" class="d-btn bh-auto-toggle">暂停更新</button></div><div class="bh-auto-summary"><span class="bh-tag bh-auto-state">自动更新中</span><span class="bh-auto-batch">第 1 次快照</span><strong><span class="bh-auto-value">55</span><small> 件已完成</small></strong></div><div class="bh-auto-chart">' + spark(points) + '</div><div class="bh-countdown"><span class="bh-auto-next">3.0 秒后更新</span><div class="bh-progress"><span style="width:0%"></span></div></div><div class="bh-footnote">自动刷新是你看到的功能；本演示使用「定时轮询」来实现。</div></div>';
      const toggle = el.querySelector('.bh-auto-toggle');
      const state = el.querySelector('.bh-auto-state');
      const label = el.querySelector('.bh-auto-next');
      const bar = el.querySelector('.bh-countdown .bh-progress span');
      api.on(toggle, 'click', function () {
        running = !running;
        toggle.textContent = running ? '暂停更新' : '继续更新';
        toggle.classList.toggle('primary', !running);
        state.textContent = running ? '自动更新中' : '已暂停';
        if (running) nextAt = Date.now() + 3000;
        else label.textContent = '页面保留当前快照';
        api.status(running ? '继续自动刷新，每 3 秒获取并显示下一批演示数据。' : '已暂停更新；图表保持当前状态。');
        api.done();
      });
      api.every(function () {
        if (!running) return;
        if (Date.now() >= nextAt) {
          batch++;
          points = points.slice(1).concat([48 + (batch * 7) % 24]);
          el.querySelector('.bh-auto-chart').innerHTML = spark(points);
          el.querySelector('.bh-auto-value').textContent = points[points.length - 1];
          el.querySelector('.bh-auto-batch').textContent = '第 ' + batch + ' 次快照';
          nextAt = Date.now() + 3000;
          api.status('自动显示了第 ' + batch + ' 次快照。你没有点击「刷新」，页面也更新了。');
        }
        const rest = Math.max(0, nextAt - Date.now()) / 1000;
        label.textContent = rest.toFixed(1) + ' 秒后更新';
        bar.style.width = (100 - rest / 3 * 100) + '%';
      }, 100);
      api.status('自动刷新已经开启，稍等 3 秒就能看见图表更新，也可以随时暂停。');
    },

    empty: function (el, api) {
      let isEmpty = false;
      el.innerHTML = '<div class="bh-demo"><div class="bh-toolbar"><div><span class="bh-eyebrow">空状态</span><h3>没有结果，也要说清下一步。</h3></div></div><div class="bh-filters" aria-label="项目筛选"><button type="button" class="d-btn bh-filter-all" aria-pressed="true">全部项目 · 3</button><button type="button" class="d-btn bh-filter-none" aria-pressed="false">只看已完成 · 0</button></div><div class="bh-empty-body" aria-live="polite"></div></div>';
      const all = el.querySelector('.bh-filter-all');
      const none = el.querySelector('.bh-filter-none');
      const body = el.querySelector('.bh-empty-body');
      function render() {
        all.setAttribute('aria-pressed', String(!isEmpty));
        none.setAttribute('aria-pressed', String(isEmpty));
        if (isEmpty) {
          body.innerHTML = '<div class="bh-empty-state"><svg viewBox="0 0 72 60" width="72" height="60" aria-hidden="true"><path d="M12 24 22 9h28l10 15v25H12Z M12 24h15l4 8h10l4-8h15" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M29 17h14" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><strong>暂时没有符合条件的项目</strong><p>当前筛选只显示「已完成」，但这 3 个项目都在进行中。</p><button type="button" class="d-btn primary bh-empty-clear">清空筛选，查看全部</button></div>';
          api.status('空状态说明了原因，也提供恢复路径。空状态与请求失败是两种状态。');
        } else {
          body.innerHTML = '<div class="bh-data-list">' + ['视觉素材整理', '界面原型制作', '需求文档检查'].map((name, i) => '<div class="bh-data-row"><span class="bh-index">0' + (i + 1) + '</span><strong>' + name + '</strong><span class="bh-tag">进行中</span></div>').join('') + '</div>';
          api.status('当前有 3 条数据。点击「只看已完成」试试无结果时的界面。');
        }
      }
      api.on(all, 'click', function () { isEmpty = false; render(); api.done(); });
      api.on(none, 'click', function () { isEmpty = true; render(); api.done(); });
      api.on(body, 'click', function (event) {
        if (!event.target.closest('.bh-empty-clear')) return;
        isEmpty = false; render(); api.done();
      });
      render();
    },

    highlight: function (el, api) {
      let active = false;
      el.innerHTML = '<div class="bh-demo"><div class="bh-toolbar"><div><span class="bh-eyebrow">高亮 · 让变化被注意到</span><h3>重要的那一条，浮出来。</h3></div><button type="button" class="d-btn primary bh-highlight-toggle">触发变化</button></div><div class="bh-highlight-list"><div class="bh-highlight-head"><span>项目</span><span>状态</span></div><div class="bh-highlight-row"><span><i>01</i> 视觉素材整理</span><span>正常</span></div><div class="bh-highlight-row bh-highlight-target"><span><i>02</i> 界面原型制作</span><span class="bh-highlight-status">正常</span></div><div class="bh-highlight-row"><span><i>03</i> 需求文档检查</span><span>正常</span></div></div><div class="bh-footnote">背景色 + 标记 + 明确文字一起出现，不仅靠颜色传递信息。</div></div>';
      const button = el.querySelector('.bh-highlight-toggle');
      const target = el.querySelector('.bh-highlight-target');
      const status = el.querySelector('.bh-highlight-status');
      api.on(button, 'click', function () {
        active = !active;
        target.classList.toggle('is-highlighted', active);
        status.innerHTML = active ? '<span class="bh-tag">● 有新变更</span>' : '正常';
        button.textContent = active ? '清除高亮' : '触发变化';
        api.status(active ? '第二行被高亮，并出现「有新变更」文字标记，帮助你快速找到变化。' : '高亮已清除，项目仍在原来的位置。');
        api.done();
      });
      api.status('点击「触发变化」，看看哪一行最先吸引你的注意。');
    },

    trend: function (el, api) {
      const values = [32, 35, 33, 41, 45, 42, 48, 55, 51, 61, 64, 69];
      let selected = 7;
      const w = 560, h = 240, left = 42, right = 18, top = 24, bottom = 35;
      function x(i) { return left + i * (w - left - right) / (values.length - 1); }
      function y(v) { return top + (80 - v) / 60 * (h - top - bottom); }
      const pts = values.map(function (v, i) { return x(i) + ',' + y(v); }).join(' ');
      const grid = [20, 40, 60, 80].map(function (v) { return '<line class="bh-chart-grid" x1="' + left + '" y1="' + y(v) + '" x2="' + (w - right) + '" y2="' + y(v) + '"/><text x="' + (left - 10) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>'; }).join('');
      const labels = [0, 3, 7, 11].map(function (i) { return '<text x="' + x(i) + '" y="' + (h - 10) + '" text-anchor="' + (i === 0 ? 'start' : i === 11 ? 'end' : 'middle') + '">第' + (i + 1) + '天</text>'; }).join('');
      el.innerHTML = '<div class="bh-demo"><div class="bh-toolbar"><div><span class="bh-eyebrow">趋势图 · 12 天演示数据</span><h3>把随时间变化的数值连起来。</h3></div><div class="bh-trend-readout"><span class="bh-trend-day">第 8 天</span><strong class="bh-trend-value">55</strong><small>完成量 / 件</small></div></div><div class="bh-trend-chart"><svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="12 天模拟完成量折线图，可使用下方滑块选择某一天">' + grid + '<polyline class="bh-chart-line" points="' + pts + '"/>' + values.map(function (v, i) { return '<circle class="bh-trend-point" cx="' + x(i) + '" cy="' + y(v) + '" r="3.5"/>'; }).join('') + '<line class="bh-cursor-line" x1="' + x(selected) + '" x2="' + x(selected) + '" y1="' + top + '" y2="' + (h - bottom) + '"/><circle class="bh-cursor-dot" cx="' + x(selected) + '" cy="' + y(values[selected]) + '" r="6"/>' + labels + '</svg></div><label class="bh-trend-slider-label"><span>选择一天查看具体值</span><input type="range" min="0" max="11" step="1" value="7" class="bh-trend-slider" aria-label="选择第几天"></label><div class="bh-footnote">本例用折线展示趋势。趋势图也可用 K 线、柱形或指标叠加；历史图形不等于未来预测。</div></div>';
      const slider = el.querySelector('.bh-trend-slider');
      const chart = el.querySelector('.bh-trend-chart svg');
      function select(i) {
        selected = Math.max(0, Math.min(values.length - 1, i));
        slider.value = selected;
        el.querySelector('.bh-trend-day').textContent = '第 ' + (selected + 1) + ' 天';
        el.querySelector('.bh-trend-value').textContent = values[selected];
        const line = el.querySelector('.bh-cursor-line');
        line.setAttribute('x1', x(selected));
        line.setAttribute('x2', x(selected));
        const dot = el.querySelector('.bh-cursor-dot');
        dot.setAttribute('cx', x(selected));
        dot.setAttribute('cy', y(values[selected]));
        const change = selected > 0 ? values[selected] - values[selected - 1] : null;
        api.status('第 ' + (selected + 1) + ' 天：完成量 ' + values[selected] + ' 件。' + (change === null ? '这是本段记录的起点。' : '比前一天' + (change >= 0 ? '增加 ' : '减少 ') + Math.abs(change) + ' 件。'));
        api.done();
      }
      api.on(slider, 'input', function () { select(Number(slider.value)); });
      function fromPointer(event) {
        const rect = chart.getBoundingClientRect();
        const vx = (event.clientX - rect.left) / rect.width * w;
        select(Math.round((vx - left) / (w - left - right) * (values.length - 1)));
      }
      api.on(chart, 'click', fromPointer);
      // SVG viewBox scaling must not shrink labels to unreadable mobile text.
      function keepLabelSize() {
        const width = chart.getBoundingClientRect().width;
        if (!width) return;
        chart.querySelectorAll('text').forEach(function (text) {
          text.style.fontSize = (11 * w / width) + 'px';
        });
      }
      const observer = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(keepLabelSize) : null;
      if (observer) observer.observe(chart);
      else api.on(window, 'resize', keepLabelSize);
      keepLabelSize();
      api.status('拖动下方滑块，或点击折线图。竖线与数字会一起定位到同一天。');
      return function () { if (observer) observer.disconnect(); };
    }
  });
})();
</script>
<script>(function(){
  'use strict';
  window.DEMO_RENDERERS=window.DEMO_RENDERERS||{};
  const icons={
    user:'<circle cx="12" cy="7" r="3"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/>',
    cache:'<path d="M4 5h16v14H4zM4 10h16M9 10v9"/>',
    db:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>',
    bell:'<path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5zM10 21h4"/>',
    wave:'<path d="M2 13h4l3-7 5 13 3-8h5"/>',
    server:'<rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 7h1M7 18h1M12 7h5M12 18h5"/>'
  };
  const icon=k=>'<svg class="data-icon" viewBox="0 0 24 24" aria-hidden="true">'+icons[k]+'</svg>';
  function frame(el,label,body){el.innerHTML='<div class="data-demo"><div class="data-kicker"><strong>'+label+'</strong><span class="data-sim">概念演示 · 本地模拟</span></div>'+body+'</div>';}
  function node(key,title,sub,id){return '<div class="data-node" data-node="'+id+'">'+icon(key)+'<b>'+title+'</b><small>'+sub+'</small></div>';}
  function metric(label,value,id,unit){return '<div class="data-metric"><span>'+label+'</span><strong><b data-val="'+id+'" style="font-weight:inherit">'+value+'</b>'+(unit?'<small>'+unit+'</small>':'')+'</strong></div>';}
  const renderers={
    interval(el,api){
      frame(el,'两次请求，隔多长时间？','<div class="data-board"><div class="data-range-head"><label for="data-interval-select">轮询间隔</label><select id="data-interval-select" class="data-select"><option value="1">1 秒</option><option value="2" selected>2 秒</option><option value="3">3 秒</option></select></div><div class="data-timeline" aria-label="请求发生时间线">'+Array.from({length:6},(_,i)=>'<div class="data-tick"><i></i><span>第 '+(i+1)+' 次</span></div>').join('')+'</div><div class="data-progress"><span></span></div><div class="data-metrics">'+metric('已发起请求','0','count','次')+metric('距离下次','—','next','秒')+'</div></div><div class="data-actions"><button class="d-btn primary" data-go>开始观察</button></div><p class="data-note">缩短间隔会更频繁地查询，也会增加请求量。演示共发起 6 次；实际浏览器计时可能有偏差。</p>');
      const select=el.querySelector('select'),go=el.querySelector('[data-go]'),countEl=el.querySelector('[data-val="count"]'),nextEl=el.querySelector('[data-val="next"]'),fill=el.querySelector('.data-progress>span'),ticks=[...el.querySelectorAll('.data-tick')];
      let timer=null,running=false,count=0,start=0,next=0,interval=2000;
      function stop(text){if(timer!==null)clearInterval(timer);timer=null;running=false;go.textContent=count===6?'重新观察':'开始观察';nextEl.textContent='—';select.disabled=false;if(text)api.status(text);}
      function fire(now){ticks[count].classList.add('is-on');ticks[count].querySelector('span').textContent=((now-start)/1000).toFixed(1)+' 秒';count++;countEl.textContent=count;next=now+interval;if(count===6){fill.style.width='100%';stop('已完成 6 次模拟请求。间隔越短，同样时长内的请求越多。');}}
      api.on(go,'click',()=>{api.done();if(running){stop('已暂停请求。');return;}count=0;countEl.textContent='0';ticks.forEach((t,i)=>{t.classList.remove('is-on');t.querySelector('span').textContent='第 '+(i+1)+' 次';});interval=Number(select.value)*1000;start=performance.now();running=true;select.disabled=true;go.textContent='暂停观察';fire(start);api.status('首次立即查询，之后约每 '+select.value+' 秒查询一次。');timer=api.every(()=>{const now=performance.now();if(!running)return;if(now>=next)fire(now);if(running){nextEl.textContent=Math.max(0,(next-now)/1000).toFixed(1);fill.style.width=(100*(1-Math.max(0,next-now)/interval))+'%';}},80);});
    },
    batch(el,api){
      const chips=()=>'<div class="data-chips">'+['A','B','C','D','E','F'].map(x=>'<span class="data-chip">'+x+'</span>').join('')+'</div>';
      frame(el,'同样 6 项数据，两种取法','<div class="data-pair"><div class="data-panel" data-single><h4>逐个请求</h4>'+chips()+'<div class="data-counter" data-count>0</div><div class="data-caption">次请求</div></div><div class="data-panel" data-batch><h4>合成一批请求</h4>'+chips()+'<div class="data-counter" data-count>0</div><div class="data-caption">次请求</div></div></div><div class="data-flow">'+node('user','客户端','要 A、B、C、D、E、F','client')+'<span class="data-arrow">→</span>'+node('server','接口','一次接收多个编号','server')+'</div><div class="data-actions"><button class="d-btn primary" data-go>播放两种取法</button></div><p class="data-note">这里假设接口允许一批查询 6 项。批量可减少请求次数，具体耗时仍取决于接口和服务端处理。</p>');
      const go=el.querySelector('[data-go]'),single=el.querySelector('[data-single]'),batch=el.querySelector('[data-batch]');
      api.on(go,'click',()=>{api.done();go.disabled=true;el.querySelectorAll('.data-chip').forEach(n=>n.classList.remove('fetched'));el.querySelectorAll('[data-count]').forEach(n=>n.textContent='0');api.status('逐个取需要多次往返；批量取把编号装进同一个请求。');for(let i=0;i<6;i++)api.later(()=>{single.querySelectorAll('.data-chip')[i].classList.add('fetched');single.querySelector('[data-count]').textContent=i+1;},220*(i+1));api.later(()=>{batch.querySelectorAll('.data-chip').forEach(n=>n.classList.add('fetched'));batch.querySelector('[data-count]').textContent='1';},400);api.later(()=>{go.disabled=false;go.textContent='重新播放';api.status('拿到同样 6 项数据：逐个用了 6 次请求，批量用了 1 次。');},1500);});
    },
    cache(el,api){
      frame(el,'第一次现做，第二次直接取现成的','<div class="data-board"><div class="data-flow">'+node('user','你的查询','查询同一个编号','query')+'<span class="data-arrow">→</span>'+node('cache','缓存','现在没有结果','cache')+'<span class="data-arrow" data-db-arrow>→</span>'+node('db','数据库','尚未查询','db')+'</div><div class="data-check" role="status">点击查询，观察数据从哪一层返回。</div><div class="data-metrics">'+metric('数据库查询','0','db','次')+metric('缓存命中','0','hits','次')+'</div></div><div class="data-actions"><button class="d-btn primary" data-query>查询同一份数据</button><button class="d-btn" data-expire>让缓存过期</button></div><p class="data-note">缓存保存的是之前的结果，命中不代表它一定最新。真实系统要规定有效期和更新条件。</p>');
      const query=el.querySelector('[data-query]'),expire=el.querySelector('[data-expire]'),check=el.querySelector('.data-check'),cacheNode=el.querySelector('[data-node="cache"]'),dbNode=el.querySelector('[data-node="db"]');let cached=false,dbCount=0,hits=0;
      api.on(query,'click',()=>{api.done();query.disabled=true;expire.disabled=true;el.querySelectorAll('.data-node').forEach(n=>n.classList.remove('active','good'));el.querySelector('[data-node="query"]').classList.add('active');check.textContent='先检查缓存…';check.classList.remove('success');api.later(()=>{cacheNode.classList.add('active');if(cached){hits++;el.querySelector('[data-val="hits"]').textContent=hits;cacheNode.classList.add('good');check.textContent='缓存命中：直接返回，数据库没有被再次查询。';check.classList.add('success');query.disabled=false;expire.disabled=false;api.status('缓存命中省去了这次数据库查询。');}else{check.textContent='缓存未命中，继续向数据库请求…';api.later(()=>{dbCount++;cached=true;dbNode.classList.add('active');dbNode.querySelector('small').textContent='已查询 '+dbCount+' 次';cacheNode.querySelector('small').textContent='已保存本次结果';el.querySelector('[data-val="db"]').textContent=dbCount;check.textContent='数据库返回结果，并存入缓存。再点一次试试。';query.disabled=false;expire.disabled=false;api.status('首次未命中：先查数据库，再保存结果供下次复用。');},450);}},300);});
      api.on(expire,'click',()=>{api.done();cached=false;cacheNode.classList.remove('active','good');cacheNode.querySelector('small').textContent='已过期，需要重取';check.classList.remove('success');check.textContent='缓存已过期。下一次查询将重新访问数据库。';api.status('过期的缓存不再直接返回，下次查询会重新获取数据。');});
    },
    cron(el,api){
      frame(el,'到了约定的钟点，再执行','<div class="data-board"><div class="data-caption" style="text-align:center">模拟时钟</div><div class="data-clock"><span data-clock>14:58</span><small>当天</small></div><div class="data-event"><span><i class="data-status-dot"></i>每日 15:00 · 生成日报</span><strong data-state>等待</strong></div><div class="data-metrics">'+metric('本日已触发','0','fires','次')+'</div></div><div class="data-actions"><button class="d-btn primary" data-step>推进 1 分钟</button><button class="d-btn" data-reset>回到 14:58</button></div><p class="data-note">这里是可点击的时钟模型。真正的 Cron 由调度服务按日历规则运行，还需要指定时区；关闭这个文件不会继续执行任务。</p>');
      let minutes=14*60+58,fired=false;const clock=el.querySelector('[data-clock]'),event=el.querySelector('.data-event'),state=el.querySelector('[data-state]'),fires=el.querySelector('[data-val="fires"]');
      function paint(){clock.textContent=String(Math.floor(minutes/60)).padStart(2,'0')+':'+String(minutes%60).padStart(2,'0');}
      api.on(el.querySelector('[data-step]'),'click',()=>{api.done();minutes++;paint();if(minutes===15*60&&!fired){fired=true;event.classList.add('is-fired');state.textContent='已执行';fires.textContent='1';api.toast('模拟日报已生成');api.status('15:00 到达，任务触发一次；继续推进不会每分钟重做。');}else api.status(fired?'本日 15:00 的任务已执行，后续分钟不会重复触发。':'时钟还没到 15:00，任务继续等待。');if(minutes>=15*60+10){el.querySelector('[data-step]').disabled=true;api.status('本日演示完成，可点击“回到 14:58”重新观察。');}});
      api.on(el.querySelector('[data-reset]'),'click',()=>{minutes=14*60+58;fired=false;paint();event.classList.remove('is-fired');state.textContent='等待';fires.textContent='0';el.querySelector('[data-step]').disabled=false;api.status('时钟回到 14:58。连续推进两次，到 15:00 触发任务。');});
    },
    signal(el,api){
      frame(el,'先识别条件，再决定是否通知','<div class="data-board"><div class="data-range-head"><label for="data-signal-score">演示评分</label><output data-score>65 分</output></div><input class="data-range" id="data-signal-score" type="range" min="0" max="100" value="65"><div class="data-rule">演示规则：评分 ≥ 80 时产生一个信号。</div><div class="data-flow">'+node('wave','Signal · 信号','条件尚未满足','signal')+'<span class="data-arrow">→</span>'+node('bell','Alert · 预警','等待通知动作','alert')+'</div><div class="data-check" role="status">把评分拖到 80 或以上。</div></div><div class="data-actions"><button class="d-btn primary" data-send disabled>发送模拟预警</button></div><p class="data-note">信号是规则识别的结果，预警是把结果通知给人。这里的 80 分阈值只用于讲解。</p>');
      const range=el.querySelector('input'),score=el.querySelector('[data-score]'),send=el.querySelector('[data-send]'),signal=el.querySelector('[data-node="signal"]'),alert=el.querySelector('[data-node="alert"]'),check=el.querySelector('.data-check');
      api.on(range,'input',()=>{api.done();const val=Number(range.value),hit=val>=80;score.textContent=val+' 分';signal.classList.toggle('active',hit);signal.querySelector('small').textContent=hit?'条件满足，信号产生':'条件尚未满足';alert.classList.remove('good');alert.querySelector('small').textContent='等待通知动作';send.disabled=!hit;check.textContent=hit?'已经有信号；是否通知，是下一步。':'评分不足 80，当前没有信号。';api.status(hit?'Signal 已产生；点击按钮把它变成一条预警通知。':'当前条件不成立，不产生信号。');});
      api.on(send,'click',()=>{api.done();alert.classList.add('good');alert.querySelector('small').textContent='通知已送达（模拟）';check.textContent='一条信号已经通过通知动作送达用户。';api.toast('演示预警：评分已达到 80 分');api.status('Alert 是通知动作。产生信号和发送通知可以分别配置。');});
    },
    ranking(el,api){
      const items=[{name:'方案 A',x:90,y:40},{name:'方案 B',x:60,y:75},{name:'方案 C',x:40,y:95}];
      frame(el,'先打分，再按分数排队','<div class="data-board"><div class="data-range-head"><label for="data-rank-weight">指标一的权重</label><output data-weight>60%</output></div><input class="data-range" id="data-rank-weight" type="range" min="0" max="100" step="10" value="60"><div class="data-rule" data-formula>评分 = 指标一 × 60% + 指标二 × 40%</div><div data-ranks></div><div class="data-caption">原始值：A = 90 / 40，B = 60 / 75，C = 40 / 95</div></div><p class="data-note">拖动权重，排名会变化。这个分数来自人为定义的演示规则，不是概率，也不等于真实品质。</p>');
      const range=el.querySelector('input'),weight=el.querySelector('[data-weight]'),formula=el.querySelector('[data-formula]'),ranks=el.querySelector('[data-ranks]');
      function paint(){const w=Number(range.value);weight.textContent=w+'%';formula.textContent='评分 = 指标一 × '+w+'% + 指标二 × '+(100-w)+'%';const sorted=items.map(v=>({...v,score:(v.x*w+v.y*(100-w))/100})).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));ranks.innerHTML=sorted.map((v,i)=>'<div class="data-rating-row"><span class="data-rank-num">'+(i+1)+'</span><span>'+v.name+'</span><div class="data-bar"><i style="width:'+v.score+'%"></i></div><span class="data-rating-score">'+(Number.isInteger(v.score)?v.score:v.score.toFixed(1))+'</span></div>').join('');return sorted[0].name;}

    dedupe(el,api){
      const records=[{id:'001',name:'记录 A'},{id:'002',name:'记录 B'},{id:'001',name:'记录 A'},{id:'003',name:'记录 C'},{id:'002',name:'记录 B'},{id:'004',name:'记录 D'}];
      frame(el,'认准同一个编号，只保留一份','<div class="data-board"><div class="data-dedupe-list">'+records.map((r,i)=>'<div class="data-record" data-index="'+i+'"><strong>'+r.name+'</strong><small>ID '+r.id+'</small></div>').join('')+'</div><div class="data-metrics">'+metric('输入记录','6','input','条')+metric('保留记录','—','keep','条')+metric('重复记录','—','duplicates','条')+'</div><div class="data-check" role="status">相同 ID 代表同一条记录。</div></div><div class="data-actions"><button class="d-btn primary" data-go>按 ID 去重</button><button class="d-btn" data-reset>恢复原始列表</button></div><p class="data-note">这个示例按 ID 保留第一条。实际需求要写清去重键，以及发生内容冲突时保留哪一版。</p>');

      api.on(go,'click',()=>{api.done();go.disabled=true;reset.disabled=true;const seen=new Set();let duplicates=0;records.forEach((r,i)=>{api.later(()=>{const card=el.querySelector('[data-index="'+i+'"]');if(seen.has(r.id)){card.classList.add('is-dupe');duplicates++;}else{seen.add(r.id);card.classList.add('is-kept');}el.querySelector('[data-val="keep"]').textContent=seen.size;el.querySelector('[data-val="duplicates"]').textContent=duplicates;if(i===records.length-1){check.textContent='6 条输入 → 保留 4 条，排除 2 条重复。';reset.disabled=false;api.status('按相同 ID 识别重复，保留首次出现的一条。');}},i*200);});});

    },
    latency(el,api){
      frame(el,'从发出请求，到收到结果','<div class="data-board"><div class="data-range-head"><label for="data-latency-range">设置模拟往返耗时</label><output data-delay>800 ms</output></div><input id="data-latency-range" class="data-range" type="range" min="200" max="2000" step="100" value="800"><div class="data-latency-track" aria-hidden="true"><i class="data-packet"></i></div><div class="data-endpoints"><span>客户端</span><span>服务端</span></div><div class="data-metrics">'+metric('本次观测耗时','—','actual','ms')+'</div><div class="data-check" role="status">准备发送模拟请求。</div></div><div class="data-actions"><button class="d-btn primary" data-go>发送并观察</button></div><p class="data-note">小球去程表示请求、回程表示响应。这里测的是本地模拟等待，实际请求还会包含网络与处理耗时。</p>');
      const range=el.querySelector('input'),output=el.querySelector('[data-delay]'),go=el.querySelector('[data-go]'),packet=el.querySelector('.data-packet'),track=el.querySelector('.data-latency-track'),actual=el.querySelector('[data-val="actual"]'),check=el.querySelector('.data-check');let timer=null;
      api.on(range,'input',()=>output.textContent=range.value+' ms');
      api.on(go,'click',()=>{api.done();go.disabled=true;range.disabled=true;const requested=Number(range.value),start=performance.now(),reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;actual.textContent='0';check.textContent='请求已发出，等待响应…';api.status('从点击发出请求开始计时，直到响应返回。');timer=api.every(()=>{const elapsed=performance.now()-start,p=Math.min(1,elapsed/requested),travel=p<.5?p*2:(1-p)*2;if(!reduced)packet.style.left=(16+travel*Math.max(0,track.clientWidth-48))+'px';actual.textContent=Math.round(elapsed);if(p>=.5)check.textContent='服务端已收到，响应正在返回…';if(p>=1){clearInterval(timer);packet.style.left='16px';go.disabled=false;range.disabled=false;check.textContent='响应已返回。本地观测 '+Math.round(elapsed)+' ms。';api.status('Latency 是等到结果所花的时间。设定 '+requested+' ms，本地观测 '+Math.round(elapsed)+' ms。');}},25);});
    },
    backtest(el,api){
      const prices=[100,102,101,104,103,107,105,108];
      frame(el,'把固定规则，放回过去走一遍','<div class="data-board"><div class="data-rule">预先固定：第 2 天开盘买 1 份，第 7 天开盘卖出；每次手续费 1。</div><svg class="data-history-chart" viewBox="0 0 520 165" role="img" aria-label="8 天虚构开盘价与交易回放"><path class="data-gridline" data-grid d=""/><path class="data-priceline" data-path d=""/><g data-points></g><g data-axis></g></svg><div class="data-caption">横轴：模拟第 1–8 天；数字为虚构开盘价。</div><div class="data-history-log" data-log><span class="data-log-pill">等待逐日回放</span></div><div class="data-metrics">'+metric('当前持仓','0','holding','份')+metric('累计现金变化','0','cash','元')+metric('扣费后结果','—','pnl','元')+'</div></div><div class="data-actions"><button class="d-btn primary" data-go>逐日回放</button></div><p class="data-note">全部价格为虚构演示。净结果 = 105 − 102 − 1 − 1 = 1；真实回测还需处理成交、滑点等，历史结果不保证未来。</p>');
      const go=el.querySelector('[data-go]'),chart=el.querySelector('.data-history-chart'),grid=el.querySelector('[data-grid]'),path=el.querySelector('[data-path]'),points=el.querySelector('[data-points]'),axis=el.querySelector('[data-axis]'),log=el.querySelector('[data-log]');
      let timer=null,index=0,holding=0,cash=0;
      function drawChart(){
        // Match SVG user units to its rendered width so text stays readable on phones.

        const coord=i=>[22+i*(width-44)/7,130-(prices[i]-100)*12.5];
        chart.setAttribute('viewBox','0 0 '+width+' 165');

        axis.innerHTML=prices.map((_,i)=>'<text x="'+coord(i)[0]+'" y="157" text-anchor="middle">'+(i+1)+'</text>').join('');
        path.setAttribute('d',prices.slice(0,index).map((_,i)=>{const c=coord(i);return(i?'L':'M')+c[0]+' '+c[1];}).join(' '));
        points.innerHTML=prices.slice(0,index).map((value,i)=>{const c=coord(i),trade=i===1||i===6;return '<circle class="'+(i===1?'data-entry':i===6?'data-exit':'data-pricepoint')+'" cx="'+c[0]+'" cy="'+c[1]+'" r="'+(trade?5:3)+'"/><text x="'+c[0]+'" y="'+(c[1]-11)+'" text-anchor="middle">'+value+'</text>';}).join('');
      }
      function tick(){
        const trade=index===1||index===6;
        let event='第 '+(index+1)+' 天 · '+prices[index];
        if(index===1){holding=1;cash=-103;event+=' · 买入';}
        if(index===6){holding=0;cash+=104;event+=' · 卖出';}
        log.innerHTML='<span class="data-log-pill '+(trade?'is-trade':'')+'">'+event+'</span>'+(index>=1?'<span class="data-log-pill">买入价 102</span>':'')+(index>=6?'<span class="data-log-pill">卖出价 105</span>':'');
        el.querySelector('[data-val="holding"]').textContent=holding;
        el.querySelector('[data-val="cash"]').textContent=cash>0?'+'+cash:cash;
        index++;drawChart();
        if(index===prices.length){clearInterval(timer);go.disabled=false;go.textContent='重新回放';el.querySelector('[data-val="pnl"]').textContent='+1';api.status('演示规则回放完成：105 − 102 − 两次手续费 2 = 净结果 +1 元。');}
      }
      drawChart();
      api.on(window,'resize',drawChart);
      api.on(go,'click',()=>{api.done();index=0;holding=0;cash=0;el.querySelector('[data-val="pnl"]').textContent='—';go.disabled=true;api.status('只按预设规则逐日执行，不在看到后续价格后修改买卖日。');tick();timer=api.every(tick,500);});
    },

      const go=el.querySelector('[data-go]'),source=el.querySelector('[data-node="source"]'),receiver=el.querySelector('[data-node="receiver"]'),env=el.querySelector('.data-envelope'),check=el.querySelector('.data-check'),payload=el.querySelector('[data-payload]');let events=0,delivered=0;
      api.on(go,'click',()=>{api.done();go.disabled=true;events++;source.classList.add('active');source.querySelector('small').textContent='订单完成，事件已产生';receiver.classList.remove('good');receiver.querySelector('small').textContent='等待事件到达';check.classList.remove('success');check.textContent='发送方发现事件，主动向接收地址发出请求。';el.querySelector('[data-val="events"]').textContent=events;payload.textContent='POST · order.completed · #'+String(events).padStart(3,'0');env.classList.add('is-sending');api.status('Webhook 由事件驱动：先发生订单完成，再主动通知接收方。');api.later(()=>{delivered++;receiver.classList.add('good');receiver.querySelector('small').textContent='已收到事件并响应';el.querySelector('[data-val="delivered"]').textContent=delivered;check.textContent='接收方收到事件，返回成功响应（模拟）。';check.classList.add('success');env.classList.remove('is-sending');go.disabled=false;source.classList.remove('active');api.status('主动推送已完成。没有发生新事件时，本演示不发请求。');},850);});
    }
  };

})();

<script>(function () {
  'use strict';  const R = {};

  R.breadcrumb = function (el, api) {

  };

  function widthDemo(el, api, type) {
    const id = fieldId();
    const isContainer = type === 'container', isBreakpoint = type === 'breakpoint';
    const inner = isContainer ? '<div class="qe-container-inner">内容容器</div>' : '<div class="qe-mini-grid ' + (isBreakpoint ? 'qe-break-grid' : 'qe-fluid-grid') + '"><span>素材 A</span><span>素材 B</span><span>素材 C</span></div>';
    frame(el, '<div class="qe-range-heading"><label class="qe-label" for="' + id + '">拖动改变容器宽度</label><output data-qe-width-read for="' + id + '"></output></div><input class="qe-range" id="' + id + '" data-qe-width type="range" min="45" max="100" value="100"><div class="qe-width-track"><div class="qe-width-box ' + (isBreakpoint ? 'qe-break-stage' : '') + '" data-qe-box>' + inner + '</div></div>' + (isBreakpoint ? '<p class="qe-foot">本例断点：180px。达到时显示 2 列，否则 1 列。</p>' : isContainer ? '<div class="qe-count" data-qe-viewport></div>' : '<p class="qe-foot">空间变窄，卡片自动换到下一行。</p>'));
    const input = el.querySelector('[data-qe-width]'), box = el.querySelector('[data-qe-box]'), read = el.querySelector('[data-qe-width-read]');
    function measure() {
      const width = box.getBoundingClientRect().width;
      read.textContent = Math.round(width) + 'px';
      if (isContainer) el.querySelector('[data-qe-viewport]').textContent = '浏览器窗口：' + window.innerWidth + 'px · 内容容器：' + Math.round(width) + 'px';
    }
    function draw() {
      const track = box.parentElement;
      const style = getComputedStyle(track);
      const available = Math.max(0, track.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight));
      box.style.width = Math.floor(available * Number(input.value) / 100) + 'px';
      measure();
    }
    draw();
    api.on(input, 'input', function () {
      draw();
      changed(api, isContainer ? '容器宽度变化；浏览器窗口宽度没有变。' : isBreakpoint ? '跨过 180px 时，这个示例的列数会切换。' : '卡片根据真实可用空间重新排列。');
    });
    api.on(window, 'resize', draw);
    const observer = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(draw) : null;
    if (observer) observer.observe(box.parentElement);
    signal(api, isContainer ? '同一个窗口里，内容容器可以有不同宽度。' : '拖动滑块，看内容怎样适应宽度。');
    return function () { if (observer) observer.disconnect(); };
  }
  R.responsive = function (el, api) { return widthDemo(el, api, 'responsive'); };
  R.breakpoint = function (el, api) { return widthDemo(el, api, 'breakpoint'); };
  R.container = function (el, api) { return widthDemo(el, api, 'container'); };

  R['grid-flex'] = function (el, api) {
    frame(el, '<div class="qe-layout-example"><span class="qe-caption">Grid · 行与列</span><div class="qe-grid-example"><span>A</span><span>B</span><span>C</span><span>D</span></div></div><div class="qe-layout-example"><span class="qe-caption">Flexbox · 沿一个方向排列</span><div class="qe-flex-example"><span>搜索</span><span>筛选</span><span>新增</span></div></div>');
    signal(api, 'Grid 常用于行列排布，Flexbox 常用于一行或一列中的排列与对齐。');
  };

  R.spacing = function (el, api) {
    frame(el, '<div class="qe-spacing-stage"><span class="qe-margin-label">Margin · 盒子外</span><div class="qe-spacing-box"><span class="qe-padding-label">Padding · 盒子内</span><div class="qe-spacing-row"><span>A</span><span>B</span><b class="qe-gap-label">Gap</b></div></div></div><div class="qe-spacing-key"><span>外边距</span><span>内边距</span><span>项目间距</span></div>');
    signal(api, 'Margin 在边框外；Padding 在边框内；Gap 在两个项目之间。');
  };

  R.overflow = function (el, api) {
    frame(el, '<span class="qe-caption" data-qe-overflow-caption>单行省略</span><div class="qe-overflow-name qe-ellipsis" data-qe-long>米白色天然亚麻混纺面料 · 春季床垫主图专用</div><button class="d-btn" type="button" data-qe-expand aria-expanded="false">展开全文</button>');
    const button = el.querySelector('[data-qe-expand]'), name = el.querySelector('[data-qe-long]');
    const id = fieldId(); name.id = id; button.setAttribute('aria-controls', id);
    let expanded = false;
    api.on(button, 'click', function () {
      expanded = !expanded;
      name.classList.toggle('qe-ellipsis', !expanded); button.textContent = expanded ? '收起全文' : '展开全文';
      button.setAttribute('aria-expanded', String(expanded));
      el.querySelector('[data-qe-overflow-caption]').textContent = expanded ? '完整换行' : '单行省略';
      changed(api, expanded ? '换行显示完整内容。' : '省略只改变显示，原文仍可展开查看。');
    });
    signal(api, '长标题先省略，点击可以查看完整名称。');
  };

  window.QUICK_EXTRA_RENDERERS = R;
  window.QUICK_EXTRA_ACTIONS = {
    'url-state':'选一个类别，看示例地址怎样变化。',
    'history-restore':'对照离开前和返回后的列表位置。',
    persistence:'点“模拟刷新”，比较两种保存范围。',
    filtering:'选择“只看面料”，看看哪些记录留下。',
    breadcrumb:'从左往右看当前位置所属的层级。',
    dirty:'改一下名字，再改回“米白亚麻”。',
    draft:'编辑草稿，看看已保存版本是否变化。',
    'pending-save':'点一次保存，观察等待和完成的区别。',
    'state-owner':'勾选记录，观察已选数量。',
    'discard-cancel':'对照两个动作各自的结果。',
    responsive:'拖动宽度，看看卡片怎样换行。',
    breakpoint:'拖动宽度，在 180px 附近观察列数。',
    container:'拖动内部容器，比较窗口和容器的宽度。',
    'grid-flex':'对照行列排布和一行中的排列。',
    spacing:'找到边框外、边框内和项目之间的空隙。',
    overflow:'展开长标题，看看省略与换行。'
  };
})();
</script>
<script>(function () {
  'use strict';
  const root=document.getElementById('ui-atlas');
  const $=selector=>root.querySelector(selector);
  const groups=[
    {id:'components',title:'界面控件'},
    {id:'behavior',title:'操作与反馈'},
    {id:'navigation',title:'列表与导航'},
    {id:'editing',title:'编辑与保存'},
    {id:'layout',title:'布局与尺寸'},
    {id:'data',title:'数据与后台'}
  ];
  const entries=window.UI_TERMS.concat(window.UI_QUICK_EXTRA_META).map(function(t){return Object.assign({},t,window.UI_QUICK[t.id]);});
  const byId=new Map(entries.map(t=>[t.id,t]));
  const conciseRelated={
    'url-state':['filtering','history-restore'],'history-restore':['url-state','persistence'],
    persistence:['draft','history-restore'],filtering:['sort','pagination'],breadcrumb:['history-restore','url-state'],
    dirty:['draft','pending-save'],draft:['dirty','pending-save'],'pending-save':['dirty','toast'],
    'state-owner':['checkbox','dirty'],'discard-cancel':['dirty','draft'],responsive:['breakpoint','container'],
    breakpoint:['responsive','container'],container:['responsive','grid-flex'],'grid-flex':['spacing','responsive'],
    spacing:['grid-flex','overflow'],overflow:['responsive','spacing']
  };
  let current='tooltip',disposeDemo=null,toastTimer=null,copyTimer=null,copySequence=0;
  const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm=value=>String(value).toLocaleLowerCase().replace(/[\s\-_/·]+/g,'');
  const specificSources={
    tooltip:[['W3C · Tooltip','https://www.w3.org/WAI/ARIA/apg/patterns/tooltip/']],
    popover:[['MDN · Popover','https://developer.mozilla.org/en-US/docs/Web/API/Popover_API']],
    checkbox:[['W3C · Checkbox','https://www.w3.org/WAI/ARIA/apg/patterns/checkbox/']],
    modal:[['W3C · Modal Dialog','https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/']],
    placeholder:[['MDN · Placeholder','https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/placeholder']],
    debounce:[['MDN · Debounce','https://developer.mozilla.org/en-US/docs/Glossary/Debounce']],
    throttle:[['MDN · Throttle','https://developer.mozilla.org/en-US/docs/Glossary/Throttle']],
    polling:[['MDN · 定时调用','https://developer.mozilla.org/en-US/docs/Web/API/Window/setInterval']],
    interval:[['MDN · 定时调用','https://developer.mozilla.org/en-US/docs/Web/API/Window/setInterval']],
    webhook:[['GitHub Docs · Webhooks','https://docs.github.com/en/webhooks/about-webhooks']]
  };
  function matchScore(t,query){
    if(!query)return 1;
    const title=norm(t.title),en=norm(t.english),id=norm(t.id);
    if(query===title||query===en||query===id)return 100;
    if(title.includes(query)||en.includes(query)||id.includes(query))return 80;
    if(t.aliases.some(a=>norm(a).includes(query)))return 60;
    if(t.aliases.some(a=>norm(a).length>=2&&query.includes(norm(a))))return 40;
    return norm(t.meaning+' '+t.use).includes(query)?20:0;
  }
  function matches(){const query=norm($('#term-search').value.trim());return entries.map((t,i)=>({t,i,score:matchScore(t,query)})).filter(x=>x.score).sort((a,b)=>b.score-a.score||a.i-b.i).map(x=>x.t);}
  function termButton(t){return '<button type="button" class="q-nav-item'+(t.id===current?' active':'')+'" data-term="'+t.id+'"'+(t.id===current?' aria-current="page"':'')+'><span><b>'+esc(t.title)+'</b><small>'+esc(t.english)+'</small></span></button>';}
  function renderNav(){
    const query=$('#term-search').value.trim(),list=matches(),nav=$('#term-nav'),scroll=nav.scrollTop;
    const oldOpen=new Set(Array.from(nav.querySelectorAll('details[open]')).map(n=>n.dataset.group));
    $('.q-sidebar').classList.toggle('is-searching',!!query);
    $('#search-count').hidden=!query;
    $('#search-count').textContent=list.length?'找到 '+list.length+' 个词条，点一下查看。':'没有找到匹配的术语。';
    if(query){
      nav.innerHTML=list.length?list.map(termButton).join(''):'<div class="q-empty">试试更短的说法，例如“弹窗”“下拉”“没保存”。<button type="button" class="q-text-btn" data-clear-search>清空搜索</button></div>';
    }else{
      nav.innerHTML=groups.map(function(g){const items=entries.filter(t=>t.category===g.id);return '<details class="q-group" data-group="'+g.id+'"'+(oldOpen.has(g.id)||byId.get(current).category===g.id?' open':'')+'><summary>'+g.title+'<span>'+items.length+'</span></summary>'+items.map(termButton).join('')+'</details>';}).join('');
    }
    nav.scrollTop=scroll;
    $('#mobile-term').innerHTML=groups.map(g=>'<optgroup label="'+g.title+'">'+entries.filter(t=>t.category===g.id).map(t=>'<option value="'+t.id+'"'+(t.id===current?' selected':'')+'>'+esc(t.title)+' · '+esc(t.english)+'</option>').join('')+'</optgroup>').join('');
  }
  function toast(message){clearTimeout(toastTimer);const el=$('#global-toast');el.textContent=message;el.hidden=false;toastTimer=setTimeout(()=>{el.hidden=true;},2400);}
  function cleanup(){if(disposeDemo){disposeDemo();disposeDemo=null;}clearTimeout(toastTimer);clearTimeout(copyTimer);$('#global-toast').hidden=true;copySequence++;$('#copy-prd').disabled=false;$('#copy-prd').textContent='复制说法';}
  function mountDemo(t){
    const stage=$('#demo-stage'),status=$('#demo-status-text'),timeouts=new Set(),intervals=new Set(),listeners=[];
    let alive=true,initializing=true,customCleanup;
    stage.innerHTML='';status.textContent='';
    stage.classList.toggle('q-compact',!!window.QUICK_EXTRA_RENDERERS[t.id]);
    const statusRow=status.closest('.q-demo-status');statusRow.hidden=true;
    const api={
      on:function(target,event,fn,options){if(!target)throw new Error('Missing target for '+t.id+':'+event);target.addEventListener(event,fn,options);listeners.push([target,event,fn,options]);},
      later:function(fn,ms){const h=setTimeout(()=>{timeouts.delete(h);if(alive)fn();},ms);timeouts.add(h);return h;},
      every:function(fn,ms){const h=setInterval(()=>{if(alive)fn();},ms);intervals.add(h);return h;},
      status:function(message){if(alive){status.textContent=message;if(!initializing)statusRow.hidden=false;}},
      done:function(){},
      toast:toast
    };
    const renderer=window.QUICK_EXTRA_RENDERERS[t.id]||window.DEMO_RENDERERS[t.id];
    customCleanup=renderer(stage,api);
    initializing=false;
    disposeDemo=function(){if(!alive)return;alive=false;timeouts.forEach(clearTimeout);intervals.forEach(clearInterval);listeners.forEach(l=>l[0].removeEventListener(l[1],l[2],l[3]));if(typeof customCleanup==='function')customCleanup();stage.querySelectorAll('dialog[open]').forEach(d=>d.close());};
  }
  function setHash(id){try{history.replaceState(null,'','#'+id);}catch(_){}}
  function showTerm(id,options){
    if(!byId.has(id))return;
    const opts=options||{};
    cleanup();current=id;
    const t=byId.get(id);
    $('#term-category').textContent=groups.find(g=>g.id===t.category).title;
    $('#term-zh').textContent=t.title;$('#term-en').textContent=t.english;
    $('#term-summary').textContent=t.meaning;$('#term-when').textContent=t.use;
    $('#term-prd').textContent=t.request;$('#term-gotcha').textContent=t.difference;
    $('#copy-feedback').textContent='';
    $('#term-action').textContent=(window.QUICK_EXTRA_ACTIONS&&window.QUICK_EXTRA_ACTIONS[id])||t.action||'试一下图中的操作。';
    $('#term-related').innerHTML=(conciseRelated[id]||t.related||[]).filter(x=>byId.has(x)).slice(0,2).map(x=>'<button type="button" data-term="'+x+'">'+esc(byId.get(x).title)+' ↗</button>').join('');
    $('.q-related').hidden=!$('#term-related').children.length;
    const sourceList=t.sources||((specificSources[id]||[]).map(s=>({label:s[0],url:s[1]})));
    $('#term-sources').innerHTML=sourceList.length?sourceList.slice(0,3).map(s=>'<li><a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+' ↗</a></li>').join(''):'<li>原《UI术语速查表》与下方通用参考；需求句为自拟示例。</li>';
    renderNav();mountDemo(t);if(opts.hash!==false)setHash(id);
    document.title=t.title+' · UI / 前端术语速查';
    if(opts.focus){$('#main-content').focus({preventScroll:true});if(matchMedia('(max-width:700px)').matches)$('#main-content').scrollIntoView({block:'start'});}
  }
  function route(){
    let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(_){id='tooltip';}
    const legacy={'scene-navigation':'url-state','scene-editor':'dirty','scene-layout':'responsive','compare-hints':'tooltip','compare-timing':'debounce','compare-refreshing':'refresh','compare-overlays':'drawer'};
    if(id.startsWith('scene-')&&id.includes('~'))id=id.split('~')[1];
    id=legacy[id]||id;showTerm(byId.has(id)?id:'tooltip',{hash:false});
  }
  async function copyText(value){
    const focused=document.activeElement;
    if(location.protocol!=='file:'&&navigator.clipboard&&window.isSecureContext){let timeout;try{const ok=await Promise.race([navigator.clipboard.writeText(value).then(()=>true),new Promise(resolve=>{timeout=setTimeout(()=>resolve(false),1600);})]);clearTimeout(timeout);if(ok)return true;}catch(_){clearTimeout(timeout);}}
    const area=document.createElement('textarea');area.value=value;area.setAttribute('readonly','');area.style.position='fixed';area.style.top='-9999px';document.body.appendChild(area);area.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}area.remove();if(focused&&focused.isConnected)focused.focus({preventScroll:true});return ok;
  }
  root.addEventListener('click',function(e){
    const term=e.target.closest('[data-term]');
    if(term){showTerm(term.dataset.term,{focus:true});return;}
    if(e.target.closest('[data-clear-search]')){$('#term-search').value='';renderNav();$('#term-search').focus();}
  });
  $('#term-search').addEventListener('input',renderNav);
  $('#term-search').addEventListener('keydown',function(e){if(e.key==='Enter'){const list=matches();if(list.length){e.preventDefault();showTerm(list[0].id,{focus:true});}}if(e.key==='Escape'){$('#term-search').value='';renderNav();}});
  $('#mobile-term').addEventListener('change',e=>showTerm(e.target.value,{focus:true}));
  $('.q-brand').addEventListener('click',function(e){e.preventDefault();$('#term-search').value='';showTerm('tooltip');window.scrollTo({top:0});});
  $('#replay').addEventListener('click',()=>{cleanup();mountDemo(byId.get(current));$('#copy-feedback').textContent='';toast('例子已重置');});
  $('#copy-prd').addEventListener('click',async function(){
    const seq=++copySequence,t=byId.get(current),button=$('#copy-prd');button.disabled=true;
    const ok=await copyText(t.request);if(seq!==copySequence)return;button.disabled=false;
    if(ok){button.textContent='已复制 ✓';$('#copy-feedback').textContent='可直接发给 AI 或前端，再按实际情况改写。';copyTimer=setTimeout(()=>{button.textContent='复制说法';},2200);}
    else{const range=document.createRange();range.selectNodeContents($('#term-prd'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);$('#copy-feedback').textContent='已选中这句话，请长按复制或按 Ctrl+C / ⌘C。';}
  });
  const dialog=$('#sources-dialog');$('#sources-open').addEventListener('click',()=>dialog.showModal());dialog.querySelector('[data-close]').addEventListener('click',()=>dialog.close());
  window.addEventListener('hashchange',route);window.addEventListener('pagehide',cleanup);window.addEventListener('pageshow',e=>{if(e.persisted)route();});
  route();
})();
</script>
